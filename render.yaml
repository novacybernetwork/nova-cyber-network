services:
  - type: web
    runtime: static
    name: nova-cyber-network
    buildCommand: npm install && npm run build
    staticPublishPath: ./out
    pullRequestPreviewsEnabled: true
    # Next's static export writes real per-route HTML files (about.html,
    # events.html, ...) plus a 404.html Render uses automatically for
    # unmatched paths — no SPA-style catch-all rewrite needed here.
    headers:
      - path: /_next/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

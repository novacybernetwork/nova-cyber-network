# NOTE ON COST: `plan: starter` below is a PAID tier (~$7/mo at time of writing) for both the web
# service and left as a comment for the database. Render's free web service tier spins down after
# 15 minutes of inactivity and takes 30-60s to "cold start" on the next request — unacceptable
# during a live 48-hour competition where a judge's or participant's first request could time out.
# Render's free Postgres plan also **expires 30 days after creation** and is deleted — fine if you
# provision it close to the Oct 24-25, 2026 event, but it will NOT persist indefinitely. Switch
# either plan value to "free" if you accept those tradeoffs (e.g. for local-only testing of the
# Blueprint itself), but we do not recommend it for the real event.
services:
  - type: web
    name: nova-ctf
    runtime: python
    plan: starter
    region: oregon
    # This repo's `main` branch hosts an unrelated project (the club's public marketing site).
    # The Django CTF platform lives on `ctf-platform` — when creating the Blueprint in the Render
    # dashboard, select the `ctf-platform` branch so Render reads *this* render.yaml, and this
    # field keeps future auto-deploys tracking that same branch rather than defaulting to main.
    branch: ctf-platform
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    healthCheckPath: /health/
    envVars:
      - key: IS_PRODUCTION
        value: "true"
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nova-ctf-db
          property: connectionString
      # RENDER_EXTERNAL_HOSTNAME is injected automatically by Render for every web service — it
      # does not need to be (and should not be) declared here. settings.py reads it directly and
      # appends it to ALLOWED_HOSTS / CSRF_TRUSTED_ORIGINS.
      - key: ALLOWED_HOSTS
        value: "localhost,127.0.0.1"
      - key: CONTACT_EMAIL
        value: "contact@novacybernetwork.org"
      - key: DEFAULT_TEAM_SIZE_LIMIT
        value: "5"
      # --- Initial administrator bootstrap (safe to leave set; ensure_admin never overwrites an
      # existing account's password — see README "Creating the initial administrator"). ---
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      # --- Optional SMTP for password-reset emails. Without these, reset emails are written to
      # the service's log stream (console backend) instead of actually being sent. ---
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "true"
      - key: DEFAULT_FROM_EMAIL
        value: "NOVA Cyber Network <noreply@novacybernetwork.org>"

databases:
  - name: nova-ctf-db
    plan: starter # see cost note above; "free" expires 30 days after creation
    databaseName: nova_ctf
    user: nova_ctf

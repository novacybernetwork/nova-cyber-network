# NOTE ON COST: both services below default to a paid tier (~$7/mo each, ~$14/mo total).
# Render's free web service tier spins down after 15 minutes of inactivity and takes 30-60s to
# "cold start" on the next request — unacceptable during a live 48-hour competition where a
# participant's first request could time out. Render's free Postgres plan also **expires 30 days
# after creation** and is deleted — fine if you provision it close to the Oct 24-25, 2026 event,
# but it will NOT persist indefinitely. Switch either plan value to "free" below if you accept
# those tradeoffs (e.g. for local-only testing of the Blueprint itself), but we do not recommend
# it for the real event.
#
# Plan naming: Render replaced the old "starter/standard/pro" names with "<cpu>c-<ram>" compute
# plan IDs in August 2026. The web service's legacy name `starter` is still accepted by Render's
# tooling, but as of this writing Render's dashboard rejects the legacy Postgres names (including
# `starter`) for newly-created databases, so the database below uses the current canonical ID
# instead. `0.1c-256mb` is Render's direct replacement for what used to be Postgres "Starter"
# (0.1 CPU / 256 MB RAM) — the same tier and roughly the same price, just renamed.
services:
  - type: web
    name: nova-ctf
    runtime: python
    plan: starter
    region: oregon
    # This repo's `main` branch hosts an unrelated project (the club's public marketing site).
    # The Django CTF platform lives on `ctf-platform` — when creating the Blueprint in the Render
    # dashboard, select the `ctf-platform` branch so Render reads *this* render.yaml, and this
    # field keeps future auto-deploys tracking that same branch rather than defaulting to main.
    branch: ctf-platform
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    healthCheckPath: /health/
    envVars:
      # Render's two documented ways to pin a Python version are the PYTHON_VERSION env var
      # (highest precedence) or a bare-version .python-version file — NOT a Heroku-style
      # runtime.txt, which Render does not read at all (confirmed the hard way: a runtime.txt
      # here was silently ignored and Render built with its own current default Python instead,
      # which didn't have a wheel for the pinned psycopg version). Both are set, redundantly, so
      # local tooling that reads .python-version and Render itself agree.
      - key: PYTHON_VERSION
        value: "3.13.7"
      - key: IS_PRODUCTION
        value: "true"
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nova-ctf-db
          property: connectionString
      # RENDER_EXTERNAL_HOSTNAME is injected automatically by Render for every web service — it
      # does not need to be (and should not be) declared here. settings.py reads it directly and
      # appends it to ALLOWED_HOSTS / CSRF_TRUSTED_ORIGINS.
      - key: ALLOWED_HOSTS
        value: "localhost,127.0.0.1"
      - key: CONTACT_EMAIL
        value: "contact@novacybernetwork.org"
      - key: DEFAULT_TEAM_SIZE_LIMIT
        value: "5"
      # --- Initial administrator bootstrap (safe to leave set; ensure_admin never overwrites an
      # existing account's password — see README "Creating the initial administrator"). ---
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      # --- Optional SMTP for password-reset emails. Without these, reset emails are written to
      # the service's log stream (console backend) instead of actually being sent. ---
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "true"
      - key: DEFAULT_FROM_EMAIL
        value: "NOVA Cyber Network <noreply@novacybernetwork.org>"

databases:
  - name: nova-ctf-db
    plan: 0.1c-256mb # current canonical ID for the old "Starter" Postgres tier — see cost note above
    diskSizeGB: 1 # plenty for a single 30-50 participant event; "free" expires 30 days after creation
    databaseName: nova_ctf
    user: nova_ctf

{% extends "base.html" %}
{% block title %}Check your email — {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="mx-auto flex min-h-[70vh] max-w-md flex-col justify-center px-4 py-16 sm:px-6 text-center">
  <div class="glass-card p-8">
    <div class="badge-cyan mx-auto">Check your inbox</div>
    <h1 class="mt-4 font-display text-2xl font-semibold text-ink">Email sent</h1>
    <p class="mt-2 text-sm text-ink-muted">If an account exists for that email, a reset link is on its way.</p>
  </div>
</div>
{% endblock %}

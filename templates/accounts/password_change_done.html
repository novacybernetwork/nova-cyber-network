{% extends "base.html" %}
{% block title %}Password updated — {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="mx-auto flex min-h-[70vh] max-w-md flex-col justify-center px-4 py-16 sm:px-6 text-center">
  <div class="glass-card p-8">
    <div class="badge-live mx-auto">Done</div>
    <h1 class="mt-4 font-display text-2xl font-semibold text-ink">Password updated</h1>
    <p class="mt-2 text-sm text-ink-muted">Your password has been changed successfully.</p>
    <a href="{% url 'core:dashboard' %}" class="btn-primary mt-6 inline-flex">Back to dashboard</a>
  </div>
</div>
{% endblock %}

{% extends "base.html" %}
{% block title %}Password reset complete — {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="mx-auto flex min-h-[70vh] max-w-md flex-col justify-center px-4 py-16 sm:px-6 text-center">
  <div class="glass-card p-8">
    <div class="badge-live mx-auto">Success</div>
    <h1 class="mt-4 font-display text-2xl font-semibold text-ink">Password reset complete</h1>
    <p class="mt-2 text-sm text-ink-muted">You can now sign in with your new password.</p>
    <a href="{% url 'accounts:login' %}" class="btn-primary mt-6 inline-flex">Sign in</a>
  </div>
</div>
{% endblock %}
